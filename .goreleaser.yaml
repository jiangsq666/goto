version: 2
project_name: goto

before:
  hooks:
    - go mod tidy

builds:
  - id: goto
    main: main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - "386"

archives:
  - id: default
    formats: [tar.gz]

    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
    name_template: "checksums.txt"

release:
  github:
    owner: jiangsq666
    name: repo
